{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Register | Freedom Wall</title>

    <!-- Core theme CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>

<body id="page-top">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container px-4">
        <a class="navbar-brand" href="{% url 'home' %}">Freedom Wall</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Log in</a></li>
                <li class="nav-item"><a class="nav-link active" href="{% url 'register' %}">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'rule' %}">Rule</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Register Section -->
<header class="bg-primary bg-gradient text-white" style="min-height:100vh;">
    <div class="container px-4 d-flex justify-content-center align-items-center" style="min-height:100vh;">
        <div class="card shadow-lg p-4" style="width:100%; max-width:450px;">

            <h2 class="mb-4 text-dark text-center">Create an Account</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form action= "{% url 'register' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label text-dark">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-dark">Password</label>
                    <input type="password" name="password1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-dark">Confirm Password</label>
                    <input type="password" name="password2" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-dark w-100 mt-3">
                    Register
                </button>
            </form>

            <p class="mt-3 text-muted text-center">
                Already have an account?
                <a href="{% url 'login' %}" class="text-decoration-none">Log in</a>
            </p>

        </div>
    </div>
</header>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
